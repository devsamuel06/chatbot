version: "3.1"

nlu:
- intent: saudacao
  examples: |
    - oi
    - olá
    - bom dia
    - boa tarde
    - opa, tudo bem?

- intent: ver_servicos
  examples: |
    - quais serviços vocês oferecem?
    - o que vocês fazem?
    - tem banho disponível?
    - quais são os preços?
    - mostra a lista de serviços

- intent: marcar_horario
  examples: |
    - quero marcar um [banho](servico)
    - preciso de um [banho](servico)
    - queria agendar uma [tosa](servico)
    - tem horário pra [banho](servico)?
    - quero agendar pro meu cachorro
    - banho pro [Rex](nome_pet)
    - tosa pra [Luna](nome_pet)
    - banho e tosa pro [Thor](nome_pet)
    - preciso de um horário
    - quero levar meu pet aí

- intent: informar_servico
  examples: |
    - [banho](servico)
    - só [banho](servico)
    - quero [banho](servico)
    - [tosa](servico)
    - só [tosa](servico)
    - [banho e tosa](servico)
    - [combo](servico)
    - [tosa higiênica](servico)

- lookup: servico
  examples: |
    - banho
    - tosa
    - banho e tosa
    - tosa higiênica

- intent: informar_detalhes_pet
  examples: |
    - o nome dele é [Pipoca](nome_pet)
    - o nome dela é [Luna](nome_pet)
    - é para o [Thor](nome_pet)
    - chama-se [Mel](nome_pet)
    - ele é um [Golden Retriever](raca)
    - uma [Poodle](raca)
    - [Bidu](nome_pet)
    - [Rex](nome_pet)

- intent: informar_horario
  examples: |
    - [amanhã as 14h](horario)
    - pode ser [as 15h](horario)
    - [16 horas](horario)
    - [hoje de tarde](horario)
    - [amanhã de manhã](horario)
    - [segunda as 10](horario)
    - pode ser [mais tarde](horario)

- lookup: horario
  examples: |
    - amanhã
    - hoje
    - depois de amanhã
    - segunda-feira
    - terça-feira
    - de manhã
    - à tarde
    - à noite
    - 14h
    - 15h
    - 16h

- intent: confirmar_agendamento
  examples: |
    - pode confirmar
    - fechado
    - está certo
    - sim, por favor
    - sim

- intent: despedida
  examples: |
    - tchau
    - até logo
    - valeu, abraço

- intent: afirmacao
  examples: |
    - sim
    - com certeza
    - pode ser
    - está bom
    - tá certo
    - ok
    - perfeito
    - ótimo
    - topado
    - legal

- intent: negacao
  examples: |
    - não
    - nega
    - nada
    - sem ser
    - não quero
    - não gosto
    - prefiro outra coisa
    - outra opção
    - tipo, não

- intent: pedir_ajuda
  examples: |
    - pode ajudar?
    - me ajuda
    - como funciona?
    - qual é o processo?
    - como faço?
    - qual o jeito?
    - me explica
    - entendi nada

- intent: out_of_scope
  examples: |
    - não quero banho
    - não quero agendar
    - esquece isso